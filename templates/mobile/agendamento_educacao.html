<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Agendamento Educação - QMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/mobile.css') }}">
</head>

<body>

<div class="container py-4">

    <div class="text-center mb-4">

        <h2 class="fw-bold text-primary">
            QMS Saúde
        </h2>

        <p class="text-muted">
            Agendamento Mobile
        </p>

    </div>

    <div class="card shadow-lg border-0 rounded-4 p-4">

        <form action="/mobile/agendar" method="POST">

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Nome Completo
                </label>

                <input type="text"
                       name="nome"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    CPF
                </label>

                <input type="text"
                       name="cpf"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Especialidade
                </label>

                <select name="especialidade"
                        class="form-select"
                        required>

                    <option value="">
                        Selecione
                    </option>

                    <option value="matriculas">
                        Matrículas
                    </option>

                    <option value="documentos">
                        Documentos
                    </option>

                    <option value="transporte">
                        Transporte Escolar
                    </option>

                    <option value="creches">
                        Creches
                    </option>

                    <option value="inclusao">
                        Inclusão Escolar
                    </option>

                    <option value="geral">
                        Atendimento Geral
                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Data
                </label>

                <input type="date"
                       name="data"
                       class="form-control"
                       required>

            </div>

            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Horário
                </label>

                <input type="time"
                       name="horario"
                       class="form-control"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-primary w-100 py-2 fw-bold">

                Confirmar Agendamento

            </button>

        </form>

    </div>

</div>

</body>
</html>
